[workspace]
members = ["crates/ocp_client", "crates/ocp_ui"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
arkit = { git = "https://github.com/richerfu/arkit.git", rev = "7fd6a955bb175db3f308f4be09159d2c9e0b1aa5" }
ocp_client = { path = "crates/ocp_client" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
napi-ohos = { version = "1.2.0", features = ["napi8"] }
napi-derive-ohos = "1.2.0"
napi-build-ohos = "1.2.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"

[profile.release]
lto = "thin"
strip = "debuginfo"
